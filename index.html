<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>抽直屬系統</title>
  <style>
    :root{
      --bg1:#f4f7fb;
      --bg2:#eaf0f8;
      --card:#ffffffd8;
      --line:#d8e2ef;
      --text:#1f2a37;
      --sub:#607086;
      --blue:#3b82f6;
      --cyan:#22c3ee;
      --warn:#f59e0b;
      --shadow:0 20px 50px rgba(42,67,101,.12);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text)}
    body{
      min-height:100vh;
      background:
        radial-gradient(circle at 12% 18%, rgba(96,165,250,.16), transparent 220px),
        radial-gradient(circle at 86% 16%, rgba(34,195,238,.14), transparent 260px),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      overflow-x:hidden;
      position:relative;
    }
    body::before{
      content:"";
      position:fixed; inset:0;
      background-image:
        linear-gradient(rgba(130,151,180,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(130,151,180,.08) 1px, transparent 1px);
      background-size:34px 34px;
      mask-image:linear-gradient(to bottom, rgba(0,0,0,.65), rgba(0,0,0,.18));
      pointer-events:none;
    }

    .wrap{
      max-width:1180px;
      margin:0 auto;
      padding:24px 20px 36px;
      position:relative;
      z-index:1;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:16px;
      gap:12px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .logo{
      width:54px;height:54px;border-radius:16px;
      background:linear-gradient(135deg,#dbeafe,#ffffff);
      border:1px solid rgba(148,163,184,.35);
      box-shadow:var(--shadow);
      display:grid;place-items:center;
      position:relative;
    }
    .logo::before{
      content:"";
      width:28px;height:28px;border-radius:10px;
      border:2px solid #3b82f6;
      transform:rotate(45deg);
      position:absolute;
    }
    .logo::after{
      content:"";
      width:10px;height:10px;border-radius:50%;
      background:#22c3ee;
      box-shadow:0 0 0 6px rgba(34,195,238,.14);
      position:absolute;
    }

    h1{
      margin:0;
      font-size:30px;
      letter-spacing:.08em;
      font-weight:900;
    }

    button{
      border:none;
      cursor:pointer;
      font:inherit;
      transition:.18s ease;
    }
    button:hover{transform:translateY(-1px)}
    button:active{transform:translateY(1px)}

    .btn{
      border-radius:16px;
      padding:12px 18px;
      font-weight:800;
    }
    .btn-outline{
      background:#ffffffc8;
      color:#0f172a;
      border:1px solid rgba(148,163,184,.35);
      box-shadow:0 10px 24px rgba(63,88,120,.08);
      backdrop-filter:blur(12px);
    }
    .btn-primary{
      background:linear-gradient(135deg, var(--blue), var(--cyan));
      color:#fff;
      box-shadow:0 16px 32px rgba(59,130,246,.25);
    }
    .btn-danger{
      background:#fff2f2;
      color:#b42318;
      border:1px solid #ffd0d0;
    }

    .hero{
      background:var(--card);
      border:1px solid rgba(255,255,255,.55);
      backdrop-filter:blur(16px);
      border-radius:32px;
      box-shadow:var(--shadow);
      padding:22px;
    }

    .hero-grid{
      display:grid;
      grid-template-columns:1.2fr .8fr;
      gap:20px;
      align-items:stretch;
    }

    .panel{
      background:rgba(255,255,255,.76);
      border:1px solid rgba(226,232,240,.9);
      border-radius:24px;
      padding:20px;
      box-shadow:0 12px 28px rgba(51,65,85,.05);
    }

    .drawbox{
      min-height:560px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:22px;
      border:1px dashed #c6d4e6;
      border-radius:24px;
      padding:28px;
      background:linear-gradient(180deg, rgba(255,255,255,.72), rgba(248,251,255,.96));
      position:relative;
      overflow:hidden;
      text-align:center;
    }
    .drawbox::before{
      content:"";
      position:absolute;
      inset:auto -20% -38% auto;
      width:260px;height:260px;border-radius:50%;
      background:radial-gradient(circle, rgba(34,195,238,.12), transparent 65%);
    }

    .status{
      font-size:15px;
      letter-spacing:.14em;
      color:#53708f;
      background:#eef6ff;
      border:1px solid #d9eafe;
      border-radius:999px;
      padding:8px 16px;
      font-weight:900;
    }

    .result-card{
      width:min(100%, 720px);
      border-radius:30px;
      padding:30px 26px;
      background:linear-gradient(145deg, rgba(255,255,255,.95), rgba(241,247,255,.92));
      border:1px solid rgba(191,219,254,.8);
      box-shadow:0 16px 36px rgba(59,130,246,.10);
    }

    .pair-label{
      color:#5d728d;
      font-size:16px;
      font-weight:900;
      letter-spacing:.18em;
      margin-bottom:16px;
    }

    .person{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      padding:16px 0;
      border-bottom:1px solid #e6edf7;
    }
    .person:last-of-type{border-bottom:none}

    .left{
      flex:1;
    }
    .left.right{
      text-align:right;
    }

    .role{
      font-size:13px;
      color:#6b7d93;
      letter-spacing:.16em;
      font-weight:900;
      margin-bottom:8px;
    }
    .name{
      font-size:42px;
      font-weight:900;
      line-height:1.15;
      word-break:break-word;
    }
    .sid{
      color:#607086;
      font-size:18px;
      margin-top:8px;
      word-break:break-all;
    }
    .arrow{
      font-size:34px;
      color:#3b82f6;
      font-weight:900;
      flex:0 0 auto;
    }

    .extra-badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-top:18px;
      padding:10px 14px;
      border-radius:999px;
      background:#fff7e8;
      color:#a16207;
      border:1px solid #fde6b2;
      font-size:14px;
      font-weight:900;
    }

    .draw-btn{
      min-width:260px;
      min-height:66px;
      font-size:24px;
      letter-spacing:.16em;
      border-radius:18px;
    }

    .side{
      display:grid;
      gap:18px;
    }

    .metric{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
    }
    .metric-card{
      background:rgba(255,255,255,.82);
      border:1px solid #e2ebf5;
      border-radius:20px;
      padding:18px 14px;
      text-align:center;
    }
    .num{
      font-size:30px;
      font-weight:900;
      color:#0f172a;
      margin-bottom:6px;
    }
    .txt{
      color:#67778d;
      font-size:13px;
      font-weight:800;
      letter-spacing:.08em;
    }

    .history-wrap{
      max-height:430px;
      overflow:auto;
      border-radius:18px;
      border:1px solid #e2ebf5;
      background:#fcfdff;
    }
    table{
      width:100%;
      border-collapse:collapse;
      font-size:15px;
    }
    thead th{
      position:sticky; top:0;
      background:#f3f8ff;
      color:#4d6684;
      font-weight:900;
      text-align:left;
      padding:14px;
      border-bottom:1px solid #dde8f5;
      letter-spacing:.05em;
    }
    tbody td{
      padding:13px 14px;
      border-bottom:1px solid #edf2f8;
      vertical-align:top;
    }
    tbody tr:nth-child(odd){background:rgba(248,250,252,.6)}

    .empty{
      color:#71839a;
      text-align:center;
      padding:26px 18px;
      line-height:1.8;
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(15,23,42,.28);
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:99;
    }
    .modal.show{display:flex}

    .modal-card{
      width:min(920px,100%);
      max-height:90vh;
      overflow:auto;
      background:#fff;
      border-radius:28px;
      box-shadow:0 28px 80px rgba(15,23,42,.22);
      border:1px solid #e6edf7;
      padding:24px;
    }

    .modal-top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:14px;
    }
    .modal-top h3{
      margin:0 0 6px;
      font-size:24px;
    }
    .modal-top p{
      margin:0;
      color:var(--sub);
      line-height:1.7;
    }

    .form-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
      margin-top:18px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .field label{
      font-weight:900;
      color:#24364a;
    }

    textarea{
      width:100%;
      min-height:290px;
      resize:vertical;
      border-radius:18px;
      border:1px solid #d8e4f2;
      padding:14px;
      font:14px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background:#fbfdff;
      color:#1e293b;
      outline:none;
    }
    textarea:focus{
      border-color:#93c5fd;
      box-shadow:0 0 0 4px rgba(147,197,253,.22);
    }

    .help{
      margin-top:12px;
      padding:14px 16px;
      border-radius:16px;
      background:#f7fbff;
      border:1px solid #dfebfa;
      color:#50657f;
      line-height:1.8;
      font-size:14px;
    }

    .modal-actions{
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:12px;
      margin-top:18px;
    }
    .action-group{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .toast{
      position:fixed;
      right:18px;
      bottom:18px;
      background:#0f172a;
      color:#fff;
      padding:13px 16px;
      border-radius:14px;
      box-shadow:0 14px 30px rgba(15,23,42,.22);
      opacity:0;
      transform:translateY(10px);
      pointer-events:none;
      transition:.22s ease;
      z-index:200;
      max-width:min(92vw,380px);
      line-height:1.6;
    }
    .toast.show{
      opacity:1;
      transform:translateY(0);
    }

    @media (max-width: 980px){
      .hero-grid,.form-grid{grid-template-columns:1fr}
      .drawbox{min-height:460px}
    }
    @media (max-width: 640px){
      h1{font-size:24px}
      .person{flex-direction:column;align-items:flex-start}
      .left.right{text-align:left}
      .name{font-size:34px}
      .metric{grid-template-columns:1fr}
      .draw-btn{width:100%}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <h1>抽直屬系統</h1>
      </div>
      <button class="btn btn-outline" id="openSettingsBtn">資料設定</button>
    </div>

    <section class="hero">
      <div class="hero-grid">
        <div class="panel">
          <div class="drawbox">
            <div class="status" id="statusText">準備開始</div>

            <div class="result-card" id="resultCard">
              <div class="pair-label">尚未抽出</div>
              <div class="person">
                <div class="left">
                  <div class="role">學弟妹</div>
                  <div class="name">等待抽籤</div>
                  <div class="sid">—</div>
                </div>
                <div class="arrow">→</div>
                <div class="left right">
                  <div class="role">學長姐</div>
                  <div class="name">等待抽籤</div>
                  <div class="sid">—</div>
                </div>
              </div>
              <div id="extraBadgeArea"></div>
            </div>

            <button class="btn btn-primary draw-btn" id="drawBtn">抽直屬</button>
          </div>
        </div>

        <div class="side">
          <div class="panel">
            <div class="metric">
              <div class="metric-card">
                <div class="num" id="seniorCount">0</div>
                <div class="txt">學長姐</div>
              </div>
              <div class="metric-card">
                <div class="num" id="juniorCount">0</div>
                <div class="txt">學弟妹</div>
              </div>
              <div class="metric-card">
                <div class="num" id="progressCount">0 / 0</div>
                <div class="txt">進度</div>
              </div>
            </div>
          </div>

          <div class="panel">
            <div class="history-wrap">
              <table>
                <thead>
                  <tr>
                    <th style="width:72px;">序號</th>
                    <th>學弟妹</th>
                    <th>學長姐</th>
                    <th style="width:110px;">狀態</th>
                  </tr>
                </thead>
                <tbody id="historyBody">
                  <tr><td colspan="4" class="empty">目前還沒有抽籤紀錄</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div class="modal" id="settingsModal">
    <div class="modal-card">
      <div class="modal-top">
        <div>
          <h3>資料設定</h3>
          <p>修改名單後按儲存即可。學弟妹會依學號排序依序上台抽。</p>
        </div>
        <button class="btn btn-outline" id="closeSettingsBtn">關閉</button>
      </div>

      <div class="form-grid">
        <div class="field">
          <label for="seniorsInput">學長姐名單</label>
          <textarea id="seniorsInput"></textarea>
        </div>
        <div class="field">
          <label for="juniorsInput">學弟妹名單</label>
          <textarea id="juniorsInput"></textarea>
        </div>
      </div>

      <div class="help">
        學長姐：<code>學號,姓名,可帶人數</code><br>
        學弟妹：<code>學號,姓名</code><br>
        可帶人數填 1 或 2。
      </div>

      <div class="modal-actions">
        <div class="action-group">
          <button class="btn btn-primary" id="saveBtn">儲存資料</button>
          <button class="btn btn-outline" id="sampleBtn">載入範例</button>
        </div>
        <div class="action-group">
          <button class="btn btn-danger" id="resetBtn">重新開始抽籤</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = "draw-zhishu-data-v3";
    const PROGRESS_KEY = "draw-zhishu-progress-v3";

    const defaultSeniors = [
      "41000123,王小明,2",
      "41000124,李佳穎,1",
      "41000125,陳信宏,2",
      "41000126,林宥廷,1",
      "41000127,張雅涵,1"
    ].join("\n");

    const defaultJuniors = [
      "51000456,陳小華",
      "51000457,吳佩珊",
      "51000458,黃子軒",
      "51000459,劉冠廷",
      "51000460,許庭瑄",
      "51000461,周柏宇",
      "51000462,謝語彤"
    ].join("\n");

    const seniorsInput = document.getElementById("seniorsInput");
    const juniorsInput = document.getElementById("juniorsInput");
    const drawBtn = document.getElementById("drawBtn");
    const historyBody = document.getElementById("historyBody");
    const statusText = document.getElementById("statusText");
    const progressCount = document.getElementById("progressCount");
    const seniorCount = document.getElementById("seniorCount");
    const juniorCount = document.getElementById("juniorCount");
    const resultCard = document.getElementById("resultCard");
    const settingsModal = document.getElementById("settingsModal");
    const toast = document.getElementById("toast");

    let appData = {
      seniors: [],
      juniors: [],
      pairs: [],
      revealedIndex: 0,
      seniorRevealCount: {}
    };

    function showToast(msg){
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2400);
    }

    function shuffle(arr){
      const a = [...arr];
      for(let i = a.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function parseSeniors(text){
      const lines = text.split(/\r?\n/).map(v => v.trim()).filter(Boolean);
      const result = [];
      const ids = new Set();

      lines.forEach((line, idx) => {
        const parts = line.split(",").map(v => v.trim());
        if(parts.length < 2) throw new Error(`學長姐第 ${idx + 1} 行格式錯誤`);
        const [id, name, capRaw] = parts;
        if(!id || !name) throw new Error(`學長姐第 ${idx + 1} 行缺少學號或姓名`);
        if(ids.has(id)) throw new Error(`學長姐學號重複：${id}`);
        ids.add(id);
        let capacity = parseInt(capRaw || "1", 10);
        if(Number.isNaN(capacity) || capacity < 1) capacity = 1;
        if(capacity > 2) capacity = 2;
        result.push({ id, name, capacity });
      });

      return result;
    }

    function parseJuniors(text){
      const lines = text.split(/\r?\n/).map(v => v.trim()).filter(Boolean);
      const result = [];
      const ids = new Set();

      lines.forEach((line, idx) => {
        const parts = line.split(",").map(v => v.trim());
        if(parts.length < 2) throw new Error(`學弟妹第 ${idx + 1} 行格式錯誤`);
        const [id, name] = parts;
        if(!id || !name) throw new Error(`學弟妹第 ${idx + 1} 行缺少學號或姓名`);
        if(ids.has(id)) throw new Error(`學弟妹學號重複：${id}`);
        ids.add(id);
        result.push({ id, name });
      });

      return result;
    }

    function sortByStudentId(list){
      return [...list].sort((a, b) =>
        a.id.localeCompare(b.id, "zh-Hant", { numeric: true })
      );
    }

    function buildPairs(seniors, juniors){
      const totalCapacity = seniors.reduce((sum, s) => sum + s.capacity, 0);
      if(juniors.length > totalCapacity){
        throw new Error(`學弟妹 ${juniors.length} 人，目前總可帶人數只有 ${totalCapacity}`);
      }

      const orderedJuniors = sortByStudentId(juniors);
      const shuffledSeniors = shuffle(seniors);

      const slots = [];
      shuffledSeniors.forEach(s => {
        for(let k = 0; k < s.capacity; k++) slots.push(s);
      });

      const shuffledSlots = shuffle(slots);

      const pairs = orderedJuniors.map((junior, idx) => ({
        junior,
        senior: shuffledSlots[idx]
      }));

      return pairs;
    }

    function saveSettings(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        seniorsText: seniorsInput.value,
        juniorsText: juniorsInput.value
      }));
    }

    function loadSettings(){
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const saved = JSON.parse(raw);
        seniorsInput.value = saved.seniorsText || defaultSeniors;
        juniorsInput.value = saved.juniorsText || defaultJuniors;
      }else{
        seniorsInput.value = defaultSeniors;
        juniorsInput.value = defaultJuniors;
      }
    }

    function saveProgress(){
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(appData));
    }

    function clearProgress(){
      localStorage.removeItem(PROGRESS_KEY);
    }

    function loadProgress(){
      const raw = localStorage.getItem(PROGRESS_KEY);
      if(raw){
        appData = JSON.parse(raw);
        renderAll();
      }else{
        rebuildFromInputs(false);
      }
    }

    function rebuildFromInputs(resetProgress = true){
      const seniors = parseSeniors(seniorsInput.value);
      const juniors = parseJuniors(juniorsInput.value);
      const pairs = buildPairs(seniors, juniors);

      appData = {
        seniors,
        juniors,
        pairs,
        revealedIndex: 0,
        seniorRevealCount: {}
      };

      if(resetProgress) clearProgress();
      renderAll();
    }

    function renderCounts(){
      seniorCount.textContent = appData.seniors.length;
      juniorCount.textContent = appData.juniors.length;
      progressCount.textContent = `${appData.revealedIndex} / ${appData.pairs.length}`;
    }

    function renderCurrentCard(){
      if(appData.revealedIndex === 0){
        resultCard.innerHTML = `
          <div class="pair-label">尚未抽出</div>
          <div class="person">
            <div class="left">
              <div class="role">學弟妹</div>
              <div class="name">等待抽籤</div>
              <div class="sid">—</div>
            </div>
            <div class="arrow">→</div>
            <div class="left right">
              <div class="role">學長姐</div>
              <div class="name">等待抽籤</div>
              <div class="sid">—</div>
            </div>
          </div>
          <div id="extraBadgeArea"></div>
        `;
        statusText.textContent = "準備開始";
        drawBtn.disabled = appData.pairs.length === 0;
        return;
      }

      const pair = appData.pairs[appData.revealedIndex - 1];
      const seniorTimes = appData.seniorRevealCount[pair.senior.id] || 1;
      const showExtra = seniorTimes >= 2;

      resultCard.innerHTML = `
        <div class="pair-label">第 ${appData.revealedIndex} 組抽籤結果</div>
        <div class="person">
          <div class="left">
            <div class="role">學弟妹</div>
            <div class="name">${escapeHtml(pair.junior.name)}</div>
            <div class="sid">${escapeHtml(pair.junior.id)}</div>
          </div>
          <div class="arrow">→</div>
          <div class="left right">
            <div class="role">學長姐</div>
            <div class="name">${escapeHtml(pair.senior.name)}</div>
            <div class="sid">${escapeHtml(pair.senior.id)}</div>
          </div>
        </div>
        ${showExtra ? `<div class="extra-badge">多帶一位</div>` : `<div id="extraBadgeArea"></div>`}
      `;

      if(appData.revealedIndex >= appData.pairs.length){
        statusText.textContent = "全部完成";
        drawBtn.disabled = true;
      }else{
        statusText.textContent = "可繼續抽";
        drawBtn.disabled = false;
      }
    }

    function renderHistory(){
      if(appData.revealedIndex === 0){
        historyBody.innerHTML = `<tr><td colspan="4" class="empty">目前還沒有抽籤紀錄</td></tr>`;
        return;
      }

      const tempCount = {};
      const rows = appData.pairs.slice(0, appData.revealedIndex).map((pair, index) => {
        tempCount[pair.senior.id] = (tempCount[pair.senior.id] || 0) + 1;
        const extra = tempCount[pair.senior.id] >= 2 ? "多帶一位" : "一般";
        return `
          <tr>
            <td>${index + 1}</td>
            <td>${escapeHtml(pair.junior.name)}<br><span style="color:#6b7d93">${escapeHtml(pair.junior.id)}</span></td>
            <td>${escapeHtml(pair.senior.name)}<br><span style="color:#6b7d93">${escapeHtml(pair.senior.id)}</span></td>
            <td>${extra}</td>
          </tr>
        `;
      }).join("");

      historyBody.innerHTML = rows;
    }

    function renderAll(){
      renderCounts();
      renderCurrentCard();
      renderHistory();
      drawBtn.textContent = appData.revealedIndex >= appData.pairs.length ? "已抽完" : "抽直屬";
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function doDraw(){
      if(appData.revealedIndex >= appData.pairs.length){
        showToast("已經全部抽完了");
        return;
      }

      const pair = appData.pairs[appData.revealedIndex];
      appData.revealedIndex += 1;
      appData.seniorRevealCount[pair.senior.id] = (appData.seniorRevealCount[pair.senior.id] || 0) + 1;

      renderAll();
      saveProgress();
    }

    document.getElementById("openSettingsBtn").addEventListener("click", () => {
      settingsModal.classList.add("show");
    });

    document.getElementById("closeSettingsBtn").addEventListener("click", () => {
      settingsModal.classList.remove("show");
    });

    settingsModal.addEventListener("click", (e) => {
      if(e.target === settingsModal) settingsModal.classList.remove("show");
    });

    document.getElementById("sampleBtn").addEventListener("click", () => {
      seniorsInput.value = defaultSeniors;
      juniorsInput.value = defaultJuniors;
      showToast("已載入範例資料");
    });

    document.getElementById("saveBtn").addEventListener("click", () => {
      try{
        parseSeniors(seniorsInput.value);
        parseJuniors(juniorsInput.value);
        saveSettings();
        rebuildFromInputs(true);
        saveProgress();
        settingsModal.classList.remove("show");
        showToast("資料已儲存");
      }catch(err){
        showToast(err.message);
      }
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      try{
        rebuildFromInputs(true);
        saveProgress();
        showToast("已重新開始");
      }catch(err){
        showToast(err.message);
      }
    });

    drawBtn.addEventListener("click", doDraw);

    loadSettings();
    try{
      loadProgress();
    }catch(err){
      showToast(err.message);
      seniorsInput.value = defaultSeniors;
      juniorsInput.value = defaultJuniors;
      rebuildFromInputs(true);
    }
  </script>
</body>
</html>
